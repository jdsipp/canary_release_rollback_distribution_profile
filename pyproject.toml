[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "jdsipp-canary_release_rollback_distribution_profile"
version = "0.1.0"
description = "抽取数值做分布分析，用中位数绝对偏差识别语音合成工程师·灰度发布与版本回滚上的离群点"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "jdsipp" }]
keywords = ["llm", "cli", "analysis", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://jdsipp.github.io"
Repository = "https://github.com/jdsipp/canary_release_rollback_distribution_profile"
Issues = "https://github.com/jdsipp/canary_release_rollback_distribution_profile/issues"

[project.scripts]
canary_release_rollback_distribution_profile = "canary_release_rollback_distribution_profile:main"

[tool.setuptools]
py-modules = ["canary_release_rollback_distribution_profile"]
